name: Net

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  net:
    name: net
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEMGREP_VERSION: 1.178.0
      OSV_SCANNER_VERSION: 2.6.0
    steps:
      - uses: actions/checkout@v7.0.1

      # Setup steps that need the network skip under `act`, which sets ACT.
      - name: Set up Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ !env.ACT }}
        run: npm ci

      - name: Install the Chromium shell
        if: ${{ !env.ACT }}
        run: npx playwright install chromium --only-shell --with-deps

      - name: Install Semgrep
        if: ${{ !env.ACT }}
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep --version

      - name: Install OSV-Scanner
        if: ${{ !env.ACT }}
        working-directory: ${{ runner.temp }}
        run: |
          release="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSLO "${release}/osv-scanner_linux_amd64"
          curl -fsSLO "${release}/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check
          sudo install -m 755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Download the advisory database
        if: ${{ !env.ACT }}
        run: npm run advisories

      - name: Run the net
        run: npm run verify
